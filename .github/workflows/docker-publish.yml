# 배포용 완성 이미지(sim-full)를 GitHub 서버에서 빌드해 ghcr.io 에 올린다.
#   - amd64(일반 PC)·arm64(Apple Silicon 맥) 를 각 아키텍처 러너에서 따로 빌드 → 하나의 태그로 묶음
#   - 결과: ghcr.io/<계정>/orchard-rover:sim-full  (docker pull 하면 자기 CPU 에 맞는 것을 받음)
#           ghcr.io/<계정>/orchard-rover:sim-full-amd64, :sim-full-arm64  (scripts/docker_share.sh pull 이 씀)
# 실행: 'v' 로 시작하는 태그를 push 하거나 (git tag v1.0 && git push origin v1.0), Actions 탭에서 Run workflow.
# 한 번에 1~2시간 (PX4·Gazebo 설치). 처음 올린 패키지는 비공개 → GitHub Packages 설정에서 Public 으로 바꿀 것.
name: Docker 배포 이미지

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/orchard-rover

jobs:
  build:
    name: sim-full (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - name: 디스크 비우기 (이미지가 10 GB 넘음)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          df -h /
      - uses: actions/checkout@v4
      - name: ghcr.io 로그인
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: sim 기반 이미지 빌드 (PX4 SITL + Gazebo Harmonic)
        run: DOCKER_BUILDKIT=1 docker build -f docker/Dockerfile --target sim --build-arg BUILD_JOBS=4 -t orchard-rover:sim .
      - name: 완성 이미지 빌드 (코드·모델·ROS 워크스페이스 빌드 포함)
        run: |
          DOCKER_BUILDKIT=1 docker build -f docker/Dockerfile.full -t orchard-rover:sim-full \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.description="Orchard rover simulation (ROS 2 Jazzy, PX4 v1.17, Gazebo Harmonic)" .
      - name: 간단 확인
        run: docker run --rm orchard-rover:sim-full bash -lc 'test -x $PX4_DIR/build/px4_sitl_default/bin/px4 && gz sim --versions && ls /workspace/ros2_ws/install | head'
      - name: 올리기
        run: |
          IMG=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag orchard-rover:sim-full "$IMG:sim-full-${{ matrix.arch }}"
          docker push "$IMG:sim-full-${{ matrix.arch }}"

  manifest:
    name: 두 아키텍처를 sim-full 태그로 묶기
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: ghcr.io 로그인
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: 묶기
        run: |
          IMG=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create -t "$IMG:sim-full" "$IMG:sim-full-amd64" "$IMG:sim-full-arm64"
          docker buildx imagetools inspect "$IMG:sim-full"
