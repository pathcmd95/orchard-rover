name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      docker_sim:
        description: 'sim Docker 이미지까지 빌드 (약 40분)'
        type: boolean
        default: false

jobs:
  algorithms:
    name: 알고리즘 단위시험 (ROS 없이)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'          # Ubuntu 24.04 기본 파이썬
      - run: pip install "numpy==1.26.4" pyyaml pytest flake8 onnx onnxruntime "opencv-python-headless==4.9.0.80"
      - run: python -m flake8 --max-line-length 120 ros2_ws/src tools
      - run: ./scripts/test_ws.sh

  ros-build:
    name: ROS 2 Jazzy 빌드/시험
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: 의존성
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3-pytest python3-opencv python3-yaml \
            ros-jazzy-xacro ros-jazzy-robot-state-publisher ros-jazzy-tf2-ros ros-jazzy-vision-msgs \
            ros-jazzy-cv-bridge ros-jazzy-sensor-msgs-py ros-jazzy-ros-gz-bridge ros-jazzy-rviz2
          git clone --depth 1 --branch v1.17.0 https://github.com/PX4/px4_msgs.git ros2_ws/src/px4_msgs
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --event-handlers console_direct-
      - name: colcon test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          source install/setup.bash
          colcon test --packages-skip px4_msgs --python-testing pytest --event-handlers console_direct+
          colcon test-result --verbose
      - name: launch 파일 문법 확인
        shell: bash
        run: |
          source ros2_ws/install/setup.bash
          ros2 launch orchard_bringup sim.launch.py --show-args > /dev/null
          ros2 launch orchard_bringup robot.launch.py --show-args > /dev/null
          xacro ros2_ws/src/orchard_description/urdf/orchard_rover.urdf.xacro sim:=true > /dev/null

  docker-sim:
    name: sim Docker 이미지
    if: github.event_name == 'workflow_dispatch' && inputs.docker_sim
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build -f docker/Dockerfile --target sim -t orchard-rover:sim --load .
      - run: docker run --rm orchard-rover:sim bash -lc 'test -x $PX4_DIR/build/px4_sitl_default/bin/px4 && gz sim --versions && MicroXRCEAgent -h | head -3'
